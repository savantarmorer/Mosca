[build]
  command = "npm run build"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/denuncia/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[redirects]]
  from = "https://www.mosca.news/*"
  to = "https://mosca.news/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/linha-editorial"
  to = "/linha-editorial/"
  status = 301

[[headers]]
  for = "/denuncia/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://pvdznwgrbeuudzhuqicw.supabase.co; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

[[headers]]
  for = "/assets/denuncia-config.js"
  [headers.values]
    Cache-Control = "no-cache"
